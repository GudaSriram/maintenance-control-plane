name: Deploy SteadyOps to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -v
      - run: python build_demo.py
      - uses: actions/configure-pages@v5
        id: pages
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install website dependencies
        working-directory: website
        run: npm install --no-audit --no-fund
      - name: Export website
        working-directory: website
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: npm run build
      - name: Keep control-plane demo accessible
        run: |
          mkdir -p website/out/control-plane
          cp -R docs/. website/out/control-plane/
          touch website/out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/out
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
